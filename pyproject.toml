[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bentlashie-pretraindata_jd260"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出预训练数据工程师·线上分布漂移的检测上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bentlashie" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bentlashie.github.io"
Repository = "https://github.com/bentlashie/pretraindata_jd260"
Issues = "https://github.com/bentlashie/pretraindata_jd260/issues"

[project.scripts]
pretraindata_jd260 = "pretraindata_jd260:main"

[tool.setuptools]
py-modules = ["pretraindata_jd260"]
